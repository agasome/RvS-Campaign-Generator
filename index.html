<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVEN SHIELD: Tactical Campaign Generator</title>
    <style>
        :root {
            --bg: #090b0e;
            --panel: #12161f;
            --panel-light: #1a202c;
            --accent: #ff3b3b;
            --accent-dim: #a31c1c;
            --text: #cbd5e1;
            --text-light: #f8fafc;
            --text-dark: #64748b;
            --border: #242b35;
            --success: #10b981;
            --fail: #f43f5e;
            --info: #38bdf8;
            --radius: 8px;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
            margin: 0;
            box-sizing: border-box;
        }

        /* Ambient scanlines overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 99999;
            opacity: 0.3;
            pointer-events: none;
            background-size: 100% 4px;
        }

        .app-container { 
            max-width: 780px; 
            width: 100%; 
            background: var(--panel); 
            border: 1px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: var(--radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 59, 59, 0.03); 
            position: relative;
            overflow: hidden;
        }

        /* Tactical Header Graphic Element */
        .banner-header {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #0e1118, rgba(163, 28, 28, 0.12));
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .banner-title {
            font-family: 'Arial Black', -apple-system, sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(163, 28, 28, 0.5);
            margin: 0;
        }

        .content-padding {
            padding: 30px;
        }

        h2 { 
            font-family: 'Arial Black', -apple-system, sans-serif;
            font-weight: 900;
            border-bottom: 1px solid var(--border); 
            padding-bottom: 12px; 
            color: var(--text-light); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        h2::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--accent);
            margin-right: 12px;
            border-radius: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .hidden { display: none !important; }

        .briefing-text { 
            line-height: 1.6; 
            font-size: 0.95rem; 
            color: var(--text); 
            margin: 20px 0; 
            background: rgba(9, 11, 14, 0.4);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px; 
        }

        .objective-box { 
            background: var(--panel-light); 
            padding: 5px 20px; 
            border-left: 4px solid var(--accent); 
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-bottom: 25px; 
        }

        .objective-row {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 12px 0;
        }
        .objective-row:last-child { border: none; }

        @media (min-width: 600px) {
            .objective-row {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .label { 
            color: var(--accent); 
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            letter-spacing: 1px;
            width: 180px;
            flex-shrink: 0;
            margin-bottom: 4px;
        }

        @media (min-width: 600px) {
            .label { margin-bottom: 0; }
        }

        .value {
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            .controls {
                display: flex;
                gap: 12px;
                margin-top: 25px;
            }
        }

        .btn { 
            padding: 12px 24px; 
            border: 1px solid var(--border); 
            border-radius: 6px;
            background: var(--panel-light); 
            color: var(--text-light); 
            cursor: pointer; 
            text-transform: uppercase; 
            font-weight: bold; 
            font-size: 0.85rem;
            font-family: inherit;
            letter-spacing: 0.5px;
            transition: all 0.2s ease; 
            width: 100%;
        }

        @media (min-width: 600px) {
            .btn { width: auto; }
        }

        .btn:hover { 
            background: var(--text-light); 
            color: #000; 
            border-color: #fff;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-setup {
            border-color: var(--border);
            color: var(--text);
            text-align: left;
            padding: 18px 20px;
            background: rgba(26, 32, 44, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .btn-setup:hover {
            background: rgba(255, 59, 59, 0.05);
            color: var(--text-light);
            border-color: var(--accent);
            transform: translateX(4px);
        }
        .btn-setup::after {
            content: "→";
            font-size: 1.1rem;
            opacity: 0.7;
        }

        .btn-success { border-color: rgba(16, 185, 129, 0.4); color: var(--success); background: rgba(16, 185, 129, 0.04); }
        .btn-success:hover { background: var(--success); color: #000; border-color: var(--success); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        
        .btn-fail { border-color: rgba(244, 63, 94, 0.4); color: var(--fail); background: rgba(244, 63, 94, 0.04); }
        .btn-fail:hover { background: var(--fail); color: #000; border-color: var(--fail); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2); }
        
        .btn-info { border-color: rgba(56, 189, 248, 0.4); color: var(--info); background: rgba(56, 189, 248, 0.04); }
        .btn-info:hover { background: var(--info); color: #000; border-color: var(--info); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2); }

        .watermark {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.04);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            pointer-events: none;
            display: none;
        }
        @media (min-width: 600px) { .watermark { display: block; } }
    </style>
</head>

        </div>
    </div>

</div>

        "Hostage Rescue": "INTELLIGENCE CONFIRMS TARGETS ARE LOCATED IN THE CENTRAL SECTOR. SEIZE INITIATIVE AND SECURE CIVILIANS SILENTLY.",
        "Lone Wolf": "THE LZ IS ISOLATED AND NO BACKUP IS AVAILABLE. YOU ARE COMPLETELY INDEPENDENT. ENGAGE AT YOUR OWN DISCRETION.",
        "Stealth Wolf": "THE AREA IS RIGGED WITH TRIPWIRES AND SECURITY NETWORK LINKS. TRIPPING ALARMS RESULTS IN IMMEDIATE MISSION FAILURE.",
        "Stealth Hunt": "NEUTRALIZE THREATS INDIVIDUALLY WITHOUT BREAKING PERIMETER STEALTH. DO NOT ALLOW PATROLS TO LOCATE DOWNED HOSTILES."
    };

    let campaign = [];
    let currentStep = 0;

    function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function generateNarrative(map, mode) {
        const hook = customMapNarratives[map] || "Intel on this sector is limited. Proceed with extreme caution and expect heavy resistance upon breach.";
        return `${hook}<br><br><span class="label">> COMPLICATION:</span> <span style="color: var(--text-light);">${objectiveComplications[mode.name]}</span><br><br>TACTICAL BREACH SEQUENCE ENGAGED AT <strong>${map.toUpperCase()}</strong>.`;
    }

    function initCampaign(length) {
        campaign = [];
        currentStep = 0;
        for(let i=0; i<length; i++) {
            let map = getRandomItem(maps);
            let mode = getRandomItem(modes);
            campaign.push({ map, mode, intro: generateNarrative(map, mode) });
        }
        document.getElementById('setup-view').classList.add('hidden');
        document.getElementById('mission-view').classList.remove('hidden');
        showMission();
    }

    function showMission() {
        const m = campaign[currentStep];
        document.getElementById('mission-header').innerText = `TACTICAL DOSSIER: PHASE ${currentStep + 1} OF ${campaign.length}`;
        document.getElementById('map-disp').innerText = m.map;
        document.getElementById('mode-disp').innerText = m.mode.name;
        document.getElementById('mode-desc').innerText = m.mode.desc.toUpperCase();
        document.getElementById('story-disp').innerHTML = m.intro;
    }

    function rerollMission() {
        let newMap = getRandomItem(maps);
        let newMode = getRandomItem(modes);
        campaign[currentStep] = { map: newMap, mode: newMode, intro: generateNarrative(newMap, newMode) };
        showMission();
    }

    function nextMission() {
        currentStep++;
        if(currentStep >= campaign.length) endCampaign(true);
        else showMission();
    }

    function endCampaign(success) {
        document.getElementById('mission-view').classList.add('hidden');
        document.getElementById('end-view').classList.remove('hidden');
        const status = document.getElementById('end-status');
        const story = document.getElementById('end-story');
        if(success) {
            status.innerText = "OPERATION: DEBRIEF COMPLETE";
            status.style.color = "var(--success)";
            story.innerText = "ALL OPERATIONAL TARGETS SECURED. CRISIS MITIGATED WITH MINIMAL COLLATERAL IMPACT. LOGGING LOGISTICAL DATA INTO THE RAINBOW DATABASES.";
        } else {
            status.innerText = "OPERATION: COMPROMISED / MISSION FAILED";
            status.style.color = "var(--fail)";
            story.innerText = "RAINBOW CELL TOOK CRITICAL LOSSES. MISSION THRESHOLD EXCEEDED. TACTICAL RETREAT RE-ROUTE CODE REQUIRED.";
        }
    }
</script>
</body>
</html>
